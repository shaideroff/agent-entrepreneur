[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-entrepreneur"
version = "1.0.0"
description = "A local-first, model-independent MCP server for entrepreneurial intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "S Haider" }]
dependencies = ["mcp>=1.9,<3", "pydantic>=2.7,<2.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
agent-entrepreneur = "agent_entrepreneur.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=agent_entrepreneur --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.setuptools.package-data]
agent_entrepreneur = ["knowledge/seed_data/*.json"]
