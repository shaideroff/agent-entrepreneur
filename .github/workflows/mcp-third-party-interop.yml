name: Third-party MCP client interoperability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typescript-client:
    name: Official TypeScript MCP client v2.4.0 over STDIO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Agent Entrepreneur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Install pinned independent MCP client
        run: npm install --no-save @modelcontextprotocol/client@2.4.0
      - name: Exercise all six tools using the TypeScript SDK client
        env:
          AGENT_ENTREPRENEUR_DB: ${{ runner.temp }}/agent-entrepreneur-interop.sqlite3
        run: node tests/interop/typescript_stdio_client.mjs
