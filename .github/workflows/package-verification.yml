name: Package verification
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-install:
    name: Build and install distribution (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv /tmp/agent-entrepreneur-venv
          /tmp/agent-entrepreneur-venv/bin/python -m pip install --upgrade pip
          /tmp/agent-entrepreneur-venv/bin/python -m pip install dist/*.whl
      - name: Smoke-test installed package and CLI entry point
        run: |
          /tmp/agent-entrepreneur-venv/bin/python -c "from importlib.metadata import entry_points; from pathlib import Path; from agent_entrepreneur.config import Settings; from agent_entrepreneur.server import create_server; entry = next(ep for ep in entry_points(group='console_scripts') if ep.name == 'agent-entrepreneur'); assert entry.value == 'agent_entrepreneur.server:main'; server = create_server(Settings(database_path=Path('/tmp/agent-entrepreneur-smoke.sqlite3'))); assert callable(server.run)"
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
