name: Package verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-install:
    name: Build and install distribution (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and source distribution
        env:
          SOURCE_DATE_EPOCH: "1767225600"
        run: python -m build
      - name: Rebuild distributions and compare SHA-256 checksums
        env:
          SOURCE_DATE_EPOCH: "1767225600"
        run: |
          rm -rf build src/agent_entrepreneur.egg-info
          python -m build --outdir /tmp/rebuilt-dist
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def hashes(directory: Path) -> dict[str, str]:
              return {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(directory.iterdir())
                  if path.is_file()
              }

          first = hashes(Path("dist"))
          second = hashes(Path("/tmp/rebuilt-dist"))
          if first != second:
              import gzip
              import io
              import tarfile

              first_sdist = next(Path("dist").glob("*.tar.gz"))
              second_sdist = next(Path("/tmp/rebuilt-dist").glob("*.tar.gz"))
              first_payload = gzip.decompress(first_sdist.read_bytes())
              second_payload = gzip.decompress(second_sdist.read_bytes())
              print(f"sdist uncompressed payload identical: {first_payload == second_payload}")
              print(f"gzip headers: {first_sdist.read_bytes()[:10]!r} / {second_sdist.read_bytes()[:10]!r}")
              with tarfile.open(fileobj=io.BytesIO(first_payload), mode="r:") as first_tar:
                  first_members = [(m.name, m.size, m.mtime) for m in first_tar.getmembers()]
              with tarfile.open(fileobj=io.BytesIO(second_payload), mode="r:") as second_tar:
                  second_members = [(m.name, m.size, m.mtime) for m in second_tar.getmembers()]
              print(f"tar member metadata identical: {first_members == second_members}")
              raise SystemExit(f"non-reproducible distributions: first={first}, second={second}")
          print(f"Reproducible distributions verified: {sorted(first)}")
          PY
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv /tmp/agent-entrepreneur-venv
          /tmp/agent-entrepreneur-venv/bin/python -m pip install --upgrade pip
          /tmp/agent-entrepreneur-venv/bin/python -m pip install dist/*.whl
      - name: Smoke-test installed package and CLI entry point
        run: |
          /tmp/agent-entrepreneur-venv/bin/python -c "from importlib.metadata import entry_points; from pathlib import Path; from agent_entrepreneur import __version__; from agent_entrepreneur.config import Settings; from agent_entrepreneur.server import create_server; assert __version__ == '1.0.0'; entry = next(ep for ep in entry_points(group='console_scripts') if ep.name == 'agent-entrepreneur'); assert entry.value == 'agent_entrepreneur.server:main'; server = create_server(Settings(database_path=Path('/tmp/agent-entrepreneur-smoke.sqlite3'))); assert callable(server.run)"
      - name: Exercise installed wheel over real MCP STDIO transport
        run: |
          /tmp/agent-entrepreneur-venv/bin/python - <<'PY'
          import asyncio
          import json
          import os
          from pathlib import Path
          import tempfile

          from mcp.client.session import ClientSession
          from mcp.client.stdio import StdioServerParameters, stdio_client

          async def main() -> None:
              executable = "/tmp/agent-entrepreneur-venv/bin/agent-entrepreneur"
              with tempfile.TemporaryDirectory() as directory:
                  env = {
                      **os.environ,
                      "AGENT_ENTREPRENEUR_TRANSPORT": "stdio",
                      "AGENT_ENTREPRENEUR_DB": str(Path(directory) / "installed-wheel.sqlite3"),
                  }
                  params = StdioServerParameters(command=executable, args=[], env=env)
                  async with stdio_client(params) as (read_stream, write_stream):
                      async with ClientSession(read_stream, write_stream) as session:
                          initialized = await session.initialize()
                          assert initialized.serverInfo.name == "Agent Entrepreneur"
                          tools = await session.list_tools()
                          names = {tool.name for tool in tools.tools}
                          expected = {
                              "understand_business",
                              "research_market",
                              "analyse_business",
                              "evaluate_decision",
                              "create_execution_plan",
                              "review_outcomes",
                              "plan_specialist_workflow",
                              "complete_specialist_workflow",
                              "resume_specialist_workflow",
                              "discover_experience_agents",
                              "get_experience_agent_profile",
                              "recommend_experience_agent_council",
                              "prepare_experience_agent_council_work",
                              "prepare_experience_agent_work_packet",
                              "synthesize_experience_agent_council",
                              "search_entrepreneurs",
                              "save_memory",
                              "search_memory",
                              "delete_memory",
                          }
                          assert expected <= names
                          result = await session.call_tool(
                              "understand_business",
                              {"name": "Installed Wheel Smoke Test", "industry": "software", "geography": "global"},
                          )
                          assert result.isError is False
                          payload = json.loads(result.content[0].text)
                          assert payload["business"]["name"] == "Installed Wheel Smoke Test"

                          experience_calls = [
                              ("discover_experience_agents", {"query": "Built from Zero"}),
                              ("get_experience_agent_profile", {"agent_id": "built_from_zero"}),
                              ("recommend_experience_agent_council", {"objective": "Evaluate a constrained founder launch."}),
                              ("prepare_experience_agent_council_work", {"objective": "Evaluate a constrained founder launch."}),
                              ("prepare_experience_agent_work_packet", {"agent_id": "built_from_zero", "objective": "Evaluate a constrained founder launch."}),
                              (
                                  "synthesize_experience_agent_council",
                                  {
                                      "objective": "Evaluate a constrained founder launch.",
                                      "contributions": [
                                          {"agent_id": "built_from_zero", "recommendations": ["Test demand first."]},
                                          {"agent_id": "jeff_bezos", "recommendations": ["Build repeatable mechanisms."]},
                                      ],
                                      "recommendation": "Run a bounded pilot with explicit decision gates.",
                                  },
                              ),
                          ]
                          for tool_name, arguments in experience_calls:
                              experience_result = await session.call_tool(tool_name, arguments)
                              assert experience_result.isError is False, tool_name
                              assert experience_result.content, tool_name

          asyncio.run(main())
          PY
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
